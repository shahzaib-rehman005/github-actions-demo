name: Demo Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Say hello
        run: echo "Hello! This job runs on every push and pull request."

  system-info:
    runs-on: ubuntu-latest
    needs: greet
    steps:
      - name: Show runner info
        run: |
          echo "Running on: $(uname -a)"
          echo "Current date: $(date)"
          echo "Workspace: $GITHUB_WORKSPACE"

  finish:
    runs-on: ubuntu-latest
    needs: system-info
    steps:
      - name: Wrap up
        run: echo "All jobs completed successfully!"
